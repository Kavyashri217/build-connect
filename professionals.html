<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildConnect - Find Professionals</title>

<link rel="stylesheet" href="css/style.css">

<style>

.professionals-container {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 0 2rem;
}

.search-filter-section {
    background: #f8f9fa;
    padding: 2rem;
    border-radius: 10px;
    margin-bottom: 2rem;
}

.search-bar {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
}

.search-bar input,
.search-bar select,
.filter-row select {
    padding: 10px 15px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 1rem;
}

.search-bar input {
    flex: 1;
    min-width: 200px;
}

/* GRID */

.professionals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 2rem;
    margin-top: 2rem;
}

/* CARD */

.professional-card {
    background: #4a5c70;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.3s, box-shadow 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    color: white;
}

.professional-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.35);
}

/* HEADER */

.professional-header {
    background: linear-gradient(135deg, #3f5468 0%, #2c3e50 100%);
    color: white;
    padding: 1.5rem;
    text-align: center;
}

.professional-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    margin: 0 auto 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
}

.professional-name {
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 0.5rem;
}

.professional-specialization {
    font-size: 0.9rem;
    opacity: 0.9;
}

/* BODY */

.professional-body {
    padding: 1.5rem;
}

.professional-info {
    margin-bottom: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9rem;
    color: #e3eaf2;
}

.professional-rating {
    color: #ffc107;
    font-size: 1.1rem;
}

.professional-rate {
    font-size: 1.1rem;
    font-weight: bold;
    color: white;
    margin-bottom: 1rem;
}

/* BUTTONS */

.professional-footer {
    display: flex;
    gap: 1rem;
}

.btn-contact {
    flex: 1;
    padding: 10px;
    background: white;
    color: #2c3e50;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    text-align: center;
}

.btn-contact:hover {
    background: #e6e6e6;
}

.btn-profile {
    flex: 1;
    padding: 10px;
    background: transparent;
    color: white;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    text-align: center;
}

.btn-profile:hover {
    background: rgba(255,255,255,0.15);
}

/* NO RESULTS */

.no-results {
    text-align: center;
    padding: 3rem;
    color: #666;
    font-size: 1.2rem;
}

.filter-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
}

.professional-location {
    font-size: 0.85rem;
    opacity: 0.8;
    margin-top: 0.25rem;
}

.professional-card .skill-list {
    margin-bottom: 1rem;
}

.professional-card .skill-chip {
    background: rgba(255,255,255,0.12);
    color: #e3eaf2;
}

.results-count {
    color: var(--gray);
    margin-top: 1rem;
}

</style>
</head>

<body>

<!-- Navigation -->
<nav id="navbar">
<div class="nav-container">
<a href="index.html" class="logo">BuildConnect</a>

<ul class="nav-links" id="navLinks">
<li><a href="index.html#home">Home</a></li>
<li><a href="professionals.html">Professionals</a></li>
<li><a href="index.html#how-it-works">How It Works</a></li>
<li><a href="index.html#about">About</a></li>
<li><a href="index.html#contact">Contact</a></li>
</ul>

<div class="menu-toggle" id="menuToggle">
<span></span>
<span></span>
<span></span>
</div>

</div>
</nav>

<!-- HERO -->

<section class="hero">
<div class="hero-content">
<h1>Find the Perfect Professional</h1>
<p>Browse our network of verified architects and civil engineers</p>
</div>
</section>

<!-- PROFESSIONALS -->

<div class="professionals-container">

<div class="search-filter-section">

<div class="search-bar">
<input type="search" id="searchInput" aria-label="Search" placeholder="Search by name, specialization, skill or city...">
</div>

<div class="filter-row">

<select id="specializationFilter" aria-label="Specialization">
<option value="">All Specializations</option>
<option value="architect">Architect</option>
<option value="civil-engineer">Civil Engineer</option>
<option value="structural-engineer">Structural Engineer</option>
<option value="site-engineer">Site Engineer</option>
</select>

<select id="experienceFilter" aria-label="Experience">
<option value="">All Experience Levels</option>
<option value="0-3">Up to 3 Years</option>
<option value="4-5">4-5 Years</option>
<option value="6+">6+ Years</option>
</select>

<select id="ratingFilter" aria-label="Minimum rating">
<option value="">All Ratings</option>
<option value="4.5">4.5+ Stars</option>
<option value="4">4+ Stars</option>
<option value="3.5">3.5+ Stars</option>
</select>

<select id="sortSelect" aria-label="Sort by">
<option value="rating">Sort: Top Rated</option>
<option value="experience">Sort: Most Experienced</option>
<option value="rate-asc">Sort: Rate (Low to High)</option>
<option value="rate-desc">Sort: Rate (High to Low)</option>
</select>

</div>

<p class="results-count" id="resultsCount" aria-live="polite"></p>
</div>

<div class="professionals-grid" id="professionalsGrid"></div>

<div class="no-results" id="noResults" hidden>
No professionals found matching your criteria.
</div>

</div>

<footer>
<p>&copy; 2026 BuildConnect. All rights reserved.</p>
</footer>

<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>

const grid = document.getElementById("professionalsGrid");
const noResults = document.getElementById("noResults");
const resultsCount = document.getElementById("resultsCount");

function renderProfessionals(data){

if(data.length===0){
grid.innerHTML="";
noResults.textContent="No professionals found matching your criteria.";
noResults.hidden=false;
resultsCount.textContent="";
return;
}

noResults.hidden=true;
resultsCount.textContent=`${data.length} professional${data.length===1?"":"s"} found`;

grid.innerHTML=data.map(prof=>`

<div class="professional-card">

<div class="professional-header">
<div class="professional-avatar">${escapeHtml(prof.avatar)}</div>
<div class="professional-name">${escapeHtml(prof.name)}</div>
<div class="professional-specialization">${escapeHtml(prof.specialization)}</div>
<div class="professional-location">📍 ${escapeHtml(prof.location)}</div>
</div>

<div class="professional-body">

<div class="professional-info">
<span>${prof.experienceYears} years experience</span>
<span class="professional-rating">⭐ ${prof.rating.toFixed(1)} (${prof.reviewCount})</span>
</div>

<div class="skill-list">
${prof.skills.slice(0,3).map(s=>`<span class="skill-chip">${escapeHtml(s)}</span>`).join("")}
</div>

<div class="professional-rate">$${prof.hourlyRate}/hour</div>

<div class="professional-footer">
<a class="btn-contact" href="profile.html?id=${prof.id}#contact">Contact</a>
<a class="btn-profile" href="profile.html?id=${prof.id}">View Profile</a>
</div>

</div>
</div>

`).join("");

}

let requestId=0;

async function filterProfessionals(){

const params=new URLSearchParams();
const q=document.getElementById("searchInput").value.trim();
const specialization=document.getElementById("specializationFilter").value;
const experience=document.getElementById("experienceFilter").value;
const minRating=document.getElementById("ratingFilter").value;
const sort=document.getElementById("sortSelect").value;

if(q) params.set("q",q);
if(specialization) params.set("specialization",specialization);
if(experience) params.set("experience",experience);
if(minRating) params.set("minRating",minRating);
params.set("sort",sort);

// Ignore responses that arrive after a newer request was sent.
const current=++requestId;
try{
const data=await apiGet(`/api/professionals?${params}`);
if(current===requestId) renderProfessionals(data);
}catch{
if(current!==requestId) return;
grid.innerHTML="";
resultsCount.textContent="";
noResults.textContent="Could not load professionals. Is the BuildConnect server running?";
noResults.hidden=false;
}

}

let searchTimer;
document.getElementById("searchInput").addEventListener("input",()=>{
clearTimeout(searchTimer);
searchTimer=setTimeout(filterProfessionals,250);
});
["specializationFilter","experienceFilter","ratingFilter","sortSelect"].forEach(id=>{
document.getElementById(id).addEventListener("change",filterProfessionals);
});

filterProfessionals();

</script>

</body>
</html>
